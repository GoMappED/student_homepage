<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoMappED Practice</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f9ecd3,#dbe9e0);font-family:Inter,system-ui;color:#2e3c3d}.card{width:min(540px,calc(100vw - 40px));padding:42px;border:1px solid rgba(255,255,255,.85);border-radius:24px;background:rgba(255,255,255,.72);box-shadow:0 22px 55px rgba(76,62,35,.16);text-align:center}.eyebrow{color:#5c786d;font-size:12px;font-weight:600;letter-spacing:1.7px}.card h1{margin:14px 0 10px;font-size:32px;font-weight:500}.card p{margin:0;color:#526364;line-height:1.6}.card a{display:inline-block;margin-top:28px;padding:12px 19px;border-radius:10px;background:#314e4a;color:white;text-decoration:none;font-weight:600;font-size:14px}
    </style>
  </head>
  <body>
    <main class="card"><div class="eyebrow">GOMAPPED · PRACTICE</div><h1 id="title">Your practice is ready</h1><p id="copy">This local preview has opened the practice destination successfully.</p><a href="../../../index.html">← Return to the village</a></main>
    <script>const skill=new URLSearchParams(location.search).get('skill')||'practice';document.getElementById('title').textContent=`${skill[0].toUpperCase()+skill.slice(1)} practice`;document.getElementById('copy').textContent=`Your ${skill} question UI will load at this route in the deployed Kellsclass app. This local page confirms the hotspot handoff works.`</script>
  </body>
</html>
